<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>WhatsApp Directo</title><style>body{font-family:system-ui,-apple-system,Arial;background:#f1f5f4;color:#142b25;margin:0;padding:24px}main{max-width:430px;margin:40px auto;background:white;border-radius:20px;padding:25px;box-shadow:0 8px 30px #163c2920}h1{font-size:25px;margin:0 0 9px}p{color:#53645f;line-height:1.5}label{display:block;font-weight:650;margin:22px 0 8px}input{box-sizing:border-box;width:100%;padding:15px;font-size:22px;border:1px solid #9aaca5;border-radius:11px}button{display:block;width:100%;border:0;border-radius:11px;padding:16px;font-size:17px;font-weight:700;margin-top:14px;cursor:pointer;background:#25d366;color:#073b20}button.business{background:#075e54;color:white}.hint{font-size:13px}#status{min-height:24px;font-size:14px;color:#9b3d24}</style></head><body><main><h1>WhatsApp Directo</h1><p>Inicia un chat sin guardar el contacto.</p><label for="phone">Número de México (10 dígitos)</label><input id="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="3312345678" maxlength="16"><button id="personal">Abrir WhatsApp personal</button><button id="business" class="business">Abrir WhatsApp Business</button><p id="status" role="status"></p><p class="hint">El mensaje no se envía automáticamente. Android puede elegir la aplicación según sus preferencias; si abre la incorrecta, cambia las aplicaciones predeterminadas o selecciona la deseada cuando aparezca el selector.</p></main><script>const input=document.getElementById('phone'),status=document.getElementById('status');function go(which){let n=input.value.replace(/\D/g,'');if(n.startsWith('52')&&n.length===12)n=n.slice(2);if(n.length!==10){status.textContent='Introduce un número mexicano de 10 dígitos.';input.focus();return}status.textContent='Abriendo conversación…';const full='52'+n;const url=which==='business'?'whatsapp://send?phone='+full+'&app=business':'whatsapp://send?phone='+full;/* WhatsApp schemes may be handled by either installed app; browser cannot reliably force a package. */if(which==='business'){window.location.href='https://wa.me/'+full}else{window.location.href=url;setTimeout(()=>{status.textContent='Si no se abrió WhatsApp personal, prueba el enlace alternativo: https://wa.me/'+full},1200)}}document.getElementById('personal').addEventListener('click',()=>go('personal'));document.getElementById('business').addEventListener('click',()=>go('business'));input.addEventListener('keydown',e=>{if(e.key==='Enter')go('personal')});</script></body></html>
